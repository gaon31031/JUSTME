<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘, 한 줄</title>
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14162B; --bg2:#1C1F3A; --paper:#F3ECDD; --paper2:#EAE0C9;
    --ink:#2B2416; --rose:#C97B84; --rose-d:#A85963; --mist:#8B8FB8; --line:#3A3D63;
  }
  :root:not([data-theme="light"]){}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:#E9E8F5;
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
    background-image: radial-gradient(circle at 20% 10%, var(--bg2), transparent 55%);
  }
  .wrap{max-width:520px; margin:0 auto; padding:28px 20px 60px;}
  header{margin-bottom:22px;}
  .date{font-size:13px; color:var(--mist); letter-spacing:.02em;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:30px; margin:6px 0 0; color:#fff;}
  .streak{
    display:flex; align-items:center; gap:8px; margin-top:14px;
    font-size:13px; color:var(--mist);
  }
  .streak b{color:var(--rose); font-size:15px;}
  .card{
    background:var(--paper); color:var(--ink); border-radius:18px;
    padding:22px; box-shadow:0 20px 40px -20px rgba(0,0,0,.5);
    position:relative;
  }
  .card::before{
    content:""; position:absolute; left:22px; top:0; bottom:0; width:1px;
    background:rgba(169,89,99,.18);
  }
  textarea{
    width:100%; min-height:84px; border:none; background:transparent;
    font-family:'Fraunces',serif; font-size:19px; line-height:1.55; color:var(--ink);
    resize:none; outline:none; padding-left:14px;
  }
  textarea::placeholder{color:#9C9273;}
  .row{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .count{font-size:12px; color:#8A805F;}
  button{
    font-family:inherit; border:none; cursor:pointer; border-radius:100px;
    padding:11px 20px; font-size:14px; font-weight:600;
  }
  .save{background:var(--rose-d); color:#fff;}
  .save:disabled{background:#C9BFA2; color:#fff; cursor:default;}
  .save:not(:disabled):active{transform:scale(.97);}
  .saved-tag{font-size:13px; color:var(--rose-d); font-weight:600; opacity:0; transition:opacity .3s;}
  .saved-tag.show{opacity:1;}

  .section-title{
    font-size:13px; color:var(--mist); margin:34px 0 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .ghost{
    background:transparent; border:1px solid var(--line); color:#C9CAE6; font-weight:500; padding:8px 14px; font-size:13px;
  }
  .entries{display:flex; flex-direction:column; gap:10px;}
  .entry{
    background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px;
  }
  .entry .d{font-size:11px; color:var(--mist); margin-bottom:5px;}
  .entry .t{font-family:'Fraunces',serif; font-size:16px; line-height:1.5; color:#F1EFFB;}
  .empty{font-size:13px; color:var(--mist); padding:20px 4px; text-align:center; border:1px dashed var(--line); border-radius:14px;}

  .install{
    margin-top:28px; padding:14px 16px; border-radius:14px; background:rgba(201,123,132,.12);
    border:1px solid rgba(201,123,132,.3); font-size:13px; color:#EBD9DB; line-height:1.6; display:none;
  }
  .install.show{display:block;}
  .install b{color:#fff;}

  .random-view{
    margin-top:14px; padding:16px; border-radius:14px; background:rgba(139,143,184,.1);
    border:1px solid var(--line); display:none;
  }
  .random-view.show{display:block;}
  .random-view .d{font-size:11px; color:var(--mist); margin-bottom:6px;}
  .random-view .t{font-family:'Fraunces',serif; font-size:17px; color:#fff; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="todayLabel"></div>
    <h1>오늘 하루, 한 줄이면 돼요</h1>
    <div class="streak">🔥 <span>연속 기록</span> <b id="streakNum">0일</b></div>
  </header>

  <div class="card">
    <textarea id="entryInput" placeholder="오늘 하루는 어땠나요?" maxlength="140"></textarea>
    <div class="row">
      <span class="count"><span id="charCount">0</span>/140</span>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="saved-tag" id="savedTag">저장됨 ✓</span>
        <button class="save" id="saveBtn" disabled>저장하기</button>
      </div>
    </div>
  </div>

  <div class="install" id="installTip">
    💡 <b>홈 화면에 추가</b>하면 앱처럼 아이콘 하나로 바로 열 수 있어요. 브라우저 메뉴에서 '홈 화면에 추가'를 눌러보세요.
  </div>

  <div class="section-title">
    <span>지난 기록</span>
    <button class="ghost" id="randomBtn">🎲 랜덤으로 보기</button>
  </div>
  <div class="random-view" id="randomView"></div>
  <div class="entries" id="entriesList"></div>
</div>

<script>
const STORE_KEY = 'oneliner_entries_v1';
const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = (s) => {
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
};

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function save(data){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; }
  catch(e){ console.error('save failed', e); return false; }
}

let entries = load();

function computeStreak(){
  let count = 0;
  let d = new Date();
  // if today not yet written, streak still counts from yesterday backwards
  if(!entries[todayStr()]) d.setDate(d.getDate()-1);
  while(true){
    const key = d.toISOString().slice(0,10);
    if(entries[key]){ count++; d.setDate(d.getDate()-1); }
    else break;
  }
  return count;
}

function renderStreak(){
  document.getElementById('streakNum').textContent = computeStreak() + '일';
}

function renderEntries(){
  const list = document.getElementById('entriesList');
  const keys = Object.keys(entries).sort().reverse().filter(k => k !== todayStr());
  if(keys.length === 0){
    list.innerHTML = '<div class="empty">아직 지난 기록이 없어요. 오늘 첫 줄을 남겨보세요.</div>';
    return;
  }
  list.innerHTML = keys.slice(0,30).map(k =>
    `<div class="entry"><div class="d">${fmt(k)}</div><div class="t">${escapeHtml(entries[k])}</div></div>`
  ).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function init(){
  document.getElementById('todayLabel').textContent = fmt(todayStr());
  const input = document.getElementById('entryInput');
  const saveBtn = document.getElementById('saveBtn');
  const charCount = document.getElementById('charCount');
  const savedTag = document.getElementById('savedTag');

  if(entries[todayStr()]){
    input.value = entries[todayStr()];
    saveBtn.textContent = '수정하기';
  }
  charCount.textContent = input.value.length;
  saveBtn.disabled = input.value.trim().length === 0;

  input.addEventListener('input', () => {
    charCount.textContent = input.value.length;
    saveBtn.disabled = input.value.trim().length === 0;
    savedTag.classList.remove('show');
  });

  saveBtn.addEventListener('click', () => {
    const val = input.value.trim();
    if(!val) return;
    entries[todayStr()] = val;
    const ok = save(entries);
    savedTag.classList.toggle('show', ok);
    saveBtn.textContent = '수정하기';
    renderStreak();
    renderEntries();
    if(!ok) alert('저장에 실패했어요. 브라우저 저장 공간을 확인해주세요.');
  });

  document.getElementById('randomBtn').addEventListener('click', () => {
    const keys = Object.keys(entries);
    const view = document.getElementById('randomView');
    if(keys.length === 0){
      view.classList.add('show');
      view.innerHTML = '<div class="t">아직 랜덤으로 볼 기록이 없어요.</div>';
      return;
    }
    const k = keys[Math.floor(Math.random()*keys.length)];
    view.classList.add('show');
    view.innerHTML = `<div class="d">${fmt(k)}</div><div class="t">${escapeHtml(entries[k])}</div>`;
  });

  renderStreak();
  renderEntries();

  // Simple install hint (not all browsers fire beforeinstallprompt reliably)
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(!isStandalone){
    document.getElementById('installTip').classList.add('show');
  }
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
