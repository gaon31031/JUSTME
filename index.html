<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘, 한 줄</title>
<meta name="theme-color" content="#14162B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12142A; --bg2:#1D2048; --bg3:#262A5C; --paper:#F5EEDF; --paper2:#EDE2C8;
    --ink:#2B2416; --rose:#E39AA3; --rose-d:#C4707B; --gold:#E8C079; --mist:#9296C4; --line:#33366B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:#EDECF8;
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%; overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 0%, rgba(201,123,132,.16), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(232,192,121,.10), transparent 40%),
      var(--bg);
  }
  .wrap{max-width:520px; margin:0 auto; padding:30px 20px 60px; position:relative;}
  header{margin-bottom:24px;}
  .date{font-size:13px; color:var(--mist); letter-spacing:.04em; text-transform:uppercase;}
  h1{font-family:'Fraunces',serif; font-weight:700; font-size:28px; margin:8px 0 0; color:#fff; line-height:1.3;}

  .streak-bar{
    display:flex; align-items:center; gap:12px; margin-top:18px; padding:14px 16px;
    background:linear-gradient(135deg, rgba(228,154,163,.14), rgba(232,192,121,.08));
    border:1px solid rgba(228,154,163,.28); border-radius:16px; cursor:default;
  }
  .flame{font-size:26px; filter:drop-shadow(0 0 10px rgba(228,154,163,.5));}
  .streak-txt{font-size:12px; color:var(--mist);}
  .streak-num{
    font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--gold);
    text-shadow:0 0 18px rgba(232,192,121,.35);
  }

  .card{
    margin-top:20px;
    background:var(--paper); color:var(--ink); border-radius:20px;
    padding:24px; box-shadow:0 24px 50px -22px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.4);
    position:relative; background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(transparent, transparent 27px, rgba(43,36,22,.05) 28px);
  }
  .card::before{
    content:""; position:absolute; left:26px; top:0; bottom:0; width:1px;
    background:rgba(196,112,123,.22);
  }
  textarea{
    width:100%; min-height:100px; border:none; background:transparent;
    font-family:'Fraunces',serif; font-size:19px; line-height:1.7; color:var(--ink);
    resize:none; outline:none; padding-left:16px;
  }
  textarea::placeholder{color:#A69A76;}
  .row{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .count{font-size:12px; color:#8A805F;}
  button{font-family:inherit; border:none; cursor:pointer; border-radius:100px; padding:12px 22px; font-size:14px; font-weight:700;}
  .save{background:linear-gradient(135deg,var(--rose-d),#B4586A); color:#fff; box-shadow:0 8px 18px -8px rgba(196,112,123,.7);}
  .save:disabled{background:#D3C7A6; color:#fff; box-shadow:none; cursor:default;}
  .save:not(:disabled):active{transform:scale(.96);}
  .saved-tag{font-size:13px; color:var(--rose-d); font-weight:700; opacity:0; transition:opacity .3s;}
  .saved-tag.show{opacity:1;}

  .section-title{font-size:13px; color:var(--mist); margin:36px 0 12px; display:flex; justify-content:space-between; align-items:center;}
  .ghost{background:rgba(255,255,255,.03); border:1px solid var(--line); color:#C9CAE6; font-weight:600; padding:9px 16px; font-size:13px;}
  .entries{display:flex; flex-direction:column; gap:10px;}
  .entry{
    background:linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid var(--line); border-radius:15px; padding:15px 17px;
  }
  .entry .d{font-size:11px; color:var(--mist); margin-bottom:6px; letter-spacing:.03em;}
  .entry .t{font-family:'Fraunces',serif; font-size:16px; line-height:1.55; color:#F3F1FC;}
  .empty{font-size:13px; color:var(--mist); padding:22px 4px; text-align:center; border:1px dashed var(--line); border-radius:15px;}

  .install{
    margin-top:26px; padding:15px 16px; border-radius:15px; background:rgba(228,154,163,.10);
    border:1px solid rgba(228,154,163,.28); font-size:13px; color:#F0DEE0; line-height:1.6; display:none;
  }
  .install.show{display:block;}
  .install b{color:#fff;}

  .random-view{
    margin-top:14px; padding:17px; border-radius:15px;
    background:linear-gradient(135deg, rgba(146,150,196,.12), rgba(228,154,163,.06));
    border:1px solid var(--line); display:none;
  }
  .random-view.show{display:block;}
  .random-view .d{font-size:11px; color:var(--mist); margin-bottom:6px;}
  .random-view .t{font-family:'Fraunces',serif; font-size:17px; color:#fff; line-height:1.55;}

  /* Streak celebration overlay */
  .celebrate{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(196,112,123,.35), rgba(18,20,42,.95));
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .celebrate.show{opacity:1; pointer-events:auto;}
  .celebrate-inner{text-align:center; transform:scale(.6); opacity:0; transition:transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s;}
  .celebrate.show .celebrate-inner{transform:scale(1); opacity:1;}
  .celebrate-flame{font-size:64px; display:block; margin-bottom:6px;}
  .celebrate-num{
    font-family:'Fraunces',serif; font-weight:700; font-size:72px; color:var(--gold);
    text-shadow:0 0 40px rgba(232,192,121,.6); line-height:1;
  }
  .celebrate-label{font-size:16px; color:#F0DEE0; margin-top:10px; font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="todayLabel"></div>
    <h1>오늘 하루, 한 줄이면 돼요</h1>
    <div class="streak-bar">
      <span class="flame">🔥</span>
      <div>
        <div class="streak-txt">연속 기록</div>
        <div class="streak-num" id="streakNum">0일</div>
      </div>
    </div>
  </header>

  <div class="card">
    <textarea id="entryInput" placeholder="오늘 하루는 어땠나요?" maxlength="300"></textarea>
    <div class="row">
      <span class="count"><span id="charCount">0</span>/300</span>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="saved-tag" id="savedTag">저장됨 ✓</span>
        <button class="save" id="saveBtn" disabled>저장하기</button>
      </div>
    </div>
  </div>

  <div class="install" id="installTip">
    💡 <b>홈 화면에 추가</b>하면 앱처럼 아이콘 하나로 바로 열 수 있어요. 브라우저 메뉴에서 '홈 화면에 추가'를 눌러보세요.
  </div>

  <div class="section-title">
    <span>지난 기록</span>
    <button class="ghost" id="randomBtn">🎲 랜덤으로 보기</button>
  </div>
  <div class="random-view" id="randomView"></div>
  <div class="entries" id="entriesList"></div>
</div>

<div class="celebrate" id="celebrate">
  <div class="celebrate-inner">
    <span class="celebrate-flame">🔥</span>
    <div class="celebrate-num" id="celebrateNum">1일</div>
    <div class="celebrate-label">연속 기록!</div>
  </div>
</div>

<script>
const STORE_KEY = 'oneliner_entries_v1';
const todayStr = () => new Date().toISOString().slice(0,10);
const fmt = (s) => {
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
};

function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e){ return {}; } }
function save(data){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; } catch(e){ console.error('save failed', e); return false; } }

let entries = load();

function computeStreak(){
  let count = 0;
  let d = new Date();
  if(!entries[todayStr()]) d.setDate(d.getDate()-1);
  while(true){
    const key = d.toISOString().slice(0,10);
    if(entries[key]){ count++; d.setDate(d.getDate()-1); }
    else break;
  }
  return count;
}

function renderStreak(){ document.getElementById('streakNum').textContent = computeStreak() + '일'; }

function renderEntries(){
  const list = document.getElementById('entriesList');
  const keys = Object.keys(entries).sort().reverse().filter(k => k !== todayStr());
  if(keys.length === 0){
    list.innerHTML = '<div class="empty">아직 지난 기록이 없어요. 오늘 첫 줄을 남겨보세요.</div>';
    return;
  }
  list.innerHTML = keys.slice(0,30).map(k =>
    `<div class="entry"><div class="d">${fmt(k)}</div><div class="t">${escapeHtml(entries[k])}</div></div>`
  ).join('');
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function celebrateStreak(n){
  const overlay = document.getElementById('celebrate');
  document.getElementById('celebrateNum').textContent = n + '일';
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1400);
}

function init(){
  document.getElementById('todayLabel').textContent = fmt(todayStr());
  const input = document.getElementById('entryInput');
  const saveBtn = document.getElementById('saveBtn');
  const charCount = document.getElementById('charCount');
  const savedTag = document.getElementById('savedTag');

  const hadToday = !!entries[todayStr()];
  if(hadToday){ input.value = entries[todayStr()]; saveBtn.textContent = '수정하기'; }
  charCount.textContent = input.value.length;
  saveBtn.disabled = input.value.trim().length === 0;

  input.addEventListener('input', () => {
    charCount.textContent = input.value.length;
    saveBtn.disabled = input.value.trim().length === 0;
    savedTag.classList.remove('show');
  });

  saveBtn.addEventListener('click', () => {
    const val = input.value.trim();
    if(!val) return;
    const wasNewDay = !entries[todayStr()];
    entries[todayStr()] = val;
    const ok = save(entries);
    savedTag.classList.toggle('show', ok);
    saveBtn.textContent = '수정하기';
    renderStreak();
    renderEntries();
    if(!ok){ alert('저장에 실패했어요. 브라우저 저장 공간을 확인해주세요.'); return; }
    if(wasNewDay) celebrateStreak(computeStreak());
  });

  document.getElementById('randomBtn').addEventListener('click', () => {
    const keys = Object.keys(entries);
    const view = document.getElementById('randomView');
    if(keys.length === 0){
      view.classList.add('show');
      view.innerHTML = '<div class="t">아직 랜덤으로 볼 기록이 없어요.</div>';
      return;
    }
    const k = keys[Math.floor(Math.random()*keys.length)];
    view.classList.add('show');
    view.innerHTML = `<div class="d">${fmt(k)}</div><div class="t">${escapeHtml(entries[k])}</div>`;
  });

  renderStreak();
  renderEntries();

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if(!isStandalone){ document.getElementById('installTip').classList.add('show'); }
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
